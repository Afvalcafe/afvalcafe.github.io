  <script>
    (function () {
      var colors = ['#2f9be0', '#f5b800', '#7dc95e', '#e8563f', '#b06ad9', '#ff8fb1'];
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function confetti() {
        var count = reduce ? 0 : 90;
        for (var i = 0; i < count; i++) {
          var p = document.createElement('i');
          p.className = 'confetti';
          var w = 6 + Math.random() * 6;
          p.style.cssText = 'left:' + Math.random() * 100 + 'vw;width:' + w + 'px;height:' + w * (0.5 + Math.random() * 0.8) + 'px;background:' + colors[i % colors.length] + ';border-radius:' + (Math.random() < 0.3 ? '50%' : '1px');
          document.body.appendChild(p);
          var drift = (Math.random() - 0.5) * 200;
          var anim = p.animate([
            { transform: 'translate(0,-20px) rotate(0deg)', opacity: 1 },
            { transform: 'translate(' + drift + 'px,105vh) rotate(' + (360 + Math.random() * 720) + 'deg)', opacity: 1 }
          ], { duration: 2200 + Math.random() * 2200, delay: Math.random() * 500, easing: 'cubic-bezier(.3,.6,.5,1)', fill: 'forwards' });
          anim.onfinish = (function (el) { return function () { el.remove(); }; })(p);
        }
      }

      document.querySelectorAll('.litter').forEach(function (el) {
        el.addEventListener('click', function () {
          el.classList.add('pop');
          setTimeout(function () { el.remove(); }, 250);
          confetti();
        });
      });
    })();
  </script>
