<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vijver (test)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #3b8bb0; }
    h1 {
      position: fixed;
      top: 5vh;
      left: 0;
      right: 0;
      z-index: 1;
      margin: 0;
      text-align: center;
      font-family: "Press Start 2P", monospace;
      font-weight: normal;
      font-size: clamp(1.4rem, 5vw, 3.2rem);
      color: #fff;
      /* pixel-outline: zwarte schaduw in 8 richtingen + slagschaduw */
      text-shadow:
        -4px 0 #16301a, 4px 0 #16301a, 0 -4px #16301a, 0 4px #16301a,
        -4px -4px #16301a, 4px -4px #16301a, -4px 4px #16301a, 4px 4px #16301a,
        0 8px #16301a;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="pond" aria-hidden="true"></canvas>
  <h1 class="pond-title">Afval &amp; Café</h1>
  <div class="counter" aria-live="polite">Opgeruimd: <span id="litter-count">0</span></div>
  <script type="module" src="/src/pond.ts"></script>
</body>
</html>
